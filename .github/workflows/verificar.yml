name: Verificar

# Corre sobre Pull Requests, nunca sobre main. Vercel despliega todo lo que llegue a main,
# así que la verificación tiene que ocurrir antes del merge: main está protegida y exige
# que este workflow pase.
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'src/**'
      - 'public/assets/**'
      # check-claims revisa también el JS con texto visible (chat.js, contacto.js).
      - 'public/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/verificar.yml'
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    # El propio job hace commit del README. Sin esta condición, ese commit dispararía otra
    # ejecución, que haría otro commit, y así indefinidamente.
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Clonar la rama del Pull Request
        uses: actions/checkout@v4
        with:
          # La rama del PR, no la mezcla que GitHub prepara: hay que poder hacer commit en ella.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # En Ubuntu, --with-deps instala las librerías del sistema con apt. En Vercel, que corre
      # sobre Amazon Linux, las instala el installCommand de vercel.json con dnf.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium --only-shell

      # El README va primero porque check-claims, al final de `npm run build`, también lo revisa.
      - name: Regenerar el README
        run: npm run build:readme

      # El mismo comando que ejecuta Vercel: valida, genera el contexto, el CSS, el PDF y la web,
      # y termina con check-claims sobre todo lo generado, incluido el texto extraído del PDF.
      - name: Build completo (el mismo que Vercel)
        run: npm run build

      # Solo el README se confirma. El PDF ya no se versiona: lo genera cada build de Vercel.
      # Además no es reproducible byte a byte (Chromium incrusta fecha e identificador), así que
      # confirmarlo metía un commit nuevo en cada ejecución aunque el perfil no cambiara.
      - name: Confirmar el README si cambió
        run: |
          if git diff --quiet -- README.md; then
            echo "Sin cambios que confirmar."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Regenera el README desde profile.json [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
